[workspace]
members = [
    "crates/neomax-core",
    "crates/neomax-cli",
    "crates/neomax-portal",
    "crates/neomax-usage-agent",
    "crates/neomax-worktrees",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Neotask Inc."]
description = "Provider-neutral control plane for coordinating coding-agent harnesses, accounts, sessions, models, worktrees, and durable task state."
readme = "README.md"
homepage = "https://github.com/NeotaskInc/neomax-orchestrator-rust"
repository = "https://github.com/NeotaskInc/neomax-orchestrator-rust"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "string"] }
fs2 = "0.4"
glob = "0.3"
libc = "0.2"
neomax-core = { path = "crates/neomax-core", version = "0.1.0" }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.9"
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Wdk_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
