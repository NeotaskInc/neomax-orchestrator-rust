name: Rust CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install quality dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1 series 2026-09-03
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
      - name: Check documentation style
        run: bash scripts/check-doc-style.sh
      - name: Check product surface
        run: bash scripts/check-product-surface.sh
      - name: Check privacy surface
        run: bash scripts/check-privacy-surface.sh
      - name: Check shell syntax
        run: bash scripts/check-shell-syntax.sh
      - name: Test bootstrap installers against a local mirror
        run: bash scripts/test-bootstrap-installers.sh
      - name: Check workflow boundaries
        run: bash dist/test-release-workflow.sh
      - name: Check diff whitespace
        run: git diff --check
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast
      - name: Run compatibility fixtures
        run: cargo test -p neomax-core --test compatibility --locked

  msrv:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1 series 2026-09-03
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          shared-key: neomax-msrv
      - name: Compile on the minimum supported Rust version
        run: cargo +1.85.0 check --workspace --all-targets --locked

  native-tests:
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        runner:
          # Native Intel testing is paused with Intel Mac publication.
          # - [self-hosted, macOS, X64, neotask-intel]
          - blacksmith-6vcpu-macos-15
          - blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1 series 2026-09-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          shared-key: neomax-native-${{ matrix.runner }}
      - name: Assert Windows private ACL enforcement
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test -p neomax-core --lib io::permissions --locked
      - name: Run native workspace tests
        run: cargo test --workspace --all-targets --locked --no-fail-fast
      - name: Check non-Windows process-group boundary
        if: runner.os != 'Windows'
        run: cargo check -p neomax-core --all-targets --locked
      - name: Run Windows process-group tests
        if: runner.os == 'Windows'
        run: cargo test -p neomax-core --lib io::process_group::windows -- --nocapture

  native-package:
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
          # Intel Mac builds paused; retain the native lane for reactivation.
          # - runner: [self-hosted, macOS, X64, neotask-intel]
          #   target: x86_64-apple-darwin
          - runner: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
          - runner: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1 series 2026-09-03
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
      - name: Check distribution scripts
        shell: bash
        run: bash scripts/check-shell-syntax.sh
      - name: Test PowerShell bootstrap installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install-ps1.ps1
      - name: Build release binaries
        shell: bash
        run: cargo build --workspace --locked --release --target "$TARGET"
      - name: Package and verify archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/neomax-artifacts"
          archive="$(bash dist/package.sh --target "$TARGET" --binaries-dir "$GITHUB_WORKSPACE/target/$TARGET/release" --output-dir "$RUNNER_TEMP/neomax-artifacts")"
          bash dist/checksums.sh --output "$RUNNER_TEMP/neomax-artifacts/SHA256SUMS" "$archive"
          bash dist/check-package.sh --archive "$archive" --version "$(bash dist/check-version.sh --print)" --target "$TARGET"
      - name: Verify isolated package installation
        shell: bash
        run: |
          archive="$(find "$RUNNER_TEMP/neomax-artifacts" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)"
          bash dist/verify-install.sh --archive "$archive" --version "$(bash dist/check-version.sh --print)" --target "$TARGET"
      - name: Upload temporary package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neomax-${{ matrix.target }}
          path: ${{ runner.temp }}/neomax-artifacts
          if-no-files-found: error
          retention-days: 7

  cross-package:
    if: github.event.pull_request.draft != true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1 series 2026-09-03
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          # Every leg runs on the same Linux x64 host, but each cross image has
          # its own glibc; host build scripts cached by one leg must not be run
          # inside another leg's older container.
          key: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --locked
      - name: Build release binaries
        run: cross build --workspace --locked --release --target "$TARGET"
      - name: Package and verify archive
        run: |
          mkdir -p "$RUNNER_TEMP/neomax-artifacts"
          archive="$(bash dist/package.sh --target "$TARGET" --binaries-dir "$GITHUB_WORKSPACE/target/$TARGET/release" --output-dir "$RUNNER_TEMP/neomax-artifacts")"
          bash dist/checksums.sh --output "$RUNNER_TEMP/neomax-artifacts/SHA256SUMS" "$archive"
          bash dist/check-package.sh --archive "$archive" --version "$(bash dist/check-version.sh --print)" --target "$TARGET"
      - name: Upload temporary package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neomax-${{ matrix.target }}
          path: ${{ runner.temp }}/neomax-artifacts
          if-no-files-found: error
          retention-days: 7

  ci-gate:
    name: CI Gate
    if: always()
    needs: [quality, msrv, native-tests, native-package, cross-package]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft == true }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$IS_DRAFT" = "true" ]; then
            echo "::error::Draft PR: full CI runs when marked ready for review"
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A required CI job finished with result: $result"
              exit 1
            fi
          done
          echo "All CI jobs passed: $RESULTS"
